<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>資料入力 試作</title>
  <style>
    :root {
      --navy: #1f3864;
      --line: #d0d7e2;
      --bg: #eef1f6;
      --red: #c0392b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Yu Gothic UI", "Segoe UI", Meiryo, sans-serif;
      font-size: 16px;
      color: #1a1a1a;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--navy);
      color: #fff;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
    }
    header input[type="text"],
    header select {
      width: 8em;
      font-size: 16px;
      padding: 6px 8px;
    }
    #fileName { font-weight: 700; }
    #status, #unref, #saveState { opacity: .95; }
    button, .filebtn {
      font-size: 15px;
      padding: 7px 12px;
      border-radius: 6px;
      border: 0;
      background: #fff;
      color: var(--navy);
      cursor: pointer;
    }
    button:disabled { opacity: .45; cursor: default; }
    button.primary { background: #f0c14d; color: #1a1a1a; font-weight: 700; }
    .filebtn input { display: none; }
    .banner {
      background: #fff8e8;
      border-bottom: 1px solid #ead7a2;
      padding: 6px 12px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .banner a { color: var(--navy); }
    .banner #modeLabel { font-weight: 700; margin-right: 8px; }
    .banner a.current { font-weight: 700; text-decoration: none; pointer-events: none; color: #333; }
    .main { flex: 1; display: flex; min-height: 0; position: relative; }
    body.flip .main { flex-direction: row-reverse; }
    #pinList {
      width: 180px;
      flex: none;
      background: #fff;
      border-right: 1px solid var(--line);
      overflow: auto;
    }
    body.flip #pinList { border-right: 0; border-left: 1px solid var(--line); }
    #pinList h2, .sheet h2 {
      font-size: 14px;
      margin: 0;
      padding: 10px 12px;
      background: #f7f9fc;
      border-bottom: 1px solid var(--line);
    }
    .pinrow, .checkrow {
      display: block;
      width: 100%;
      text-align: left;
      background: #fff;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      padding: 8px 10px;
      color: #1a1a1a;
    }
    .pinrow.current, .checkrow.current { background: #fdecea; }
    .stage { flex: 1; overflow: auto; min-width: 0; }
    .pager {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px;
      background: rgba(238, 241, 246, .95);
    }
    .page-wrap { position: relative; margin: 0 auto 24px; width: fit-content; }
    canvas { display: block; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
    #pinLayer { position: absolute; inset: 0; }
    .pin {
      position: absolute;
      width: 28px;
      height: 28px;
      margin: -14px 0 0 -14px;
      border-radius: 50%;
      background: var(--red);
      color: #fff;
      font-weight: 700;
      border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.35);
      padding: 0;
    }
    .pin.current { outline: 3px solid #f0c14d; }
    .sheet {
      width: 340px;
      min-width: 280px;
      flex: none;
      background: #fff;
      border-left: 1px solid var(--line);
      overflow: auto;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    #formPanel { width: 520px; }
    body.flip .sheet { border-left: 0; border-right: 1px solid var(--line); }
    body.collapsed .sheet { display: none; }
    .sheet.floating {
      position: fixed;
      z-index: 15;
      display: flex !important;
      height: min(72vh, 680px);
      border: 1px solid #c9d7ef;
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(0,0,0,.25);
    }
    .sheetHead {
      cursor: grab;
      background: var(--navy);
      color: #fff;
      padding: 8px 12px;
      font-weight: 700;
      flex: none;
    }
    .sheetResize {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 10px;
      cursor: ew-resize;
      z-index: 4;
      left: 0;
    }
    body.flip .sheetResize,
    .sheet.floating .sheetResize { left: auto; right: 0; }
    .block { padding: 10px 12px 14px; border-bottom: 1px solid var(--line); }
    .order {
      background: #f4f8ff;
      border: 1px solid #c9d7ef;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .rowline { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .rowline .name { width: 9.5em; flex: none; font-size: 15px; line-height: 1.3; }
    .rowline input { min-width: 0; font-size: 16px; padding: 8px; }
    .rowline input.field, .rowline select.field { width: 11em; flex: none; font-size: 16px; }
    .rowline input.value, .rowline select.value { flex: 1; min-width: 10em; font-size: 16px; padding: 8px; }
    .rowline { flex-wrap: wrap; }
    .radios { display: flex; gap: 12px; flex: 1; flex-wrap: wrap; align-items: center; }
    .radios label, .unsure, .checkline { display: inline-flex; align-items: center; gap: 4px; }
    .unsure { font-size: 13px; color: #8a5a00; }
    .flag { color: #8a5a00; font-weight: 700; }
    #bulkBar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    #bulkPanel {
      position: fixed;
      z-index: 18;
      top: 108px;
      right: 16px;
      width: min(460px, calc(100% - 32px));
      max-height: min(72vh, 680px);
      overflow: auto;
      background: #fff;
      border: 1px solid #c9d7ef;
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(0,0,0,.22);
    }
    #bulkPanel header {
      position: sticky;
      top: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--navy);
      color: #fff;
    }
    .bulk-row {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
    }
    .bulk-row b { width: 5.5em; flex: none; }
    .bulk-copied { flex: 1; min-width: 4em; font-size: 16px; }
    .bulk-row input[type="text"] { flex: 1; min-width: 8em; font-size: 16px; padding: 8px; }
    .bulk-switch { display: flex; gap: 8px; padding: 8px 12px; background: #f4f8ff; }
    .bulk-switch button.current { background: var(--navy); color: #fff; }
    .bulk-flow { padding: 0 12px 8px; }
    .bulk-flow textarea { width: 100%; min-height: 180px; font-size: 16px; padding: 8px; }
    .bulk-add { margin: 4px 12px 12px; }
    .hint { color: #8a5a00; font-size: 13px; margin: -4px 0 6px; }
    .checkrow small, .pinrow small { display: block; color: #444; font-weight: 400; }
    .review-item { display: flex; gap: 8px; padding: 4px 0; border-bottom: 1px solid #f0f0f0; }
    .review-item b { width: 9.5em; flex: none; }
    #card {
      position: fixed;
      z-index: 20;
      width: 280px;
      background: #fff;
      border: 2px solid var(--red);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,.2);
    }
    #card header {
      background: var(--red);
      cursor: grab;
      padding: 6px 8px;
    }
    #card .body { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    #card textarea, #card select, #card input[type="text"] { width: 100%; font-size: 16px; }
    #card .checkline input { width: auto; }
    #card textarea { min-height: 64px; }
    #card .row { display: flex; justify-content: space-between; gap: 6px; }
    #toast {
      position: fixed;
      bottom: 16px;
      left: 16px;
      background: #1a1a1a;
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      display: flex;
      gap: 8px;
      align-items: center;
      z-index: 30;
    }
    #modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.35);
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #modal .box {
      background: #fff;
      width: min(420px, calc(100% - 32px));
      border-radius: 10px;
      padding: 18px;
    }
    #modal p { margin: 0 0 14px; font-size: 18px; }
    #modal .actions { display: flex; gap: 8px; justify-content: flex-end; }
    #lock {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,.94);
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      font-size: 22px;
      line-height: 1.5;
    }
    #lock a { color: var(--navy); font-weight: 700; }
    [hidden] { display: none !important; }
    body.mode-a .bonly { display: none !important; }
    body.mode-b .aonly { display: none !important; }
    #backEdit, #completeB { display: none; }
    body.mode-b.reviewing #backEdit,
    body.mode-b.reviewing #completeB { display: inline-flex; }
    body.mode-b.reviewing #reviewBtn { display: none !important; }
    body.mode-b.reviewing #form { display: none !important; }
    body.mode-b.reviewing #review { display: block !important; flex: 1; overflow: auto; }
    #empty {
      padding: 48px 16px;
      text-align: center;
      color: #555;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <header>
    <input id="name" type="text" placeholder="あなたの名前" autocomplete="name">
    <span id="fileName">PDFが未選択</span>
    <span id="status"></span>
    <span id="unref" class="bonly"></span>
    <span id="saveState"></span>
    <button type="button" id="saveBtn">ここまで保存</button>
    <button type="button" id="completeA" class="aonly primary">確認完了</button>
    <button type="button" id="reviewBtn" class="bonly primary">確認する</button>
    <button type="button" id="backEdit" class="bonly">入力に戻る</button>
    <button type="button" id="completeB" class="bonly primary">入力完了</button>
    <label class="filebtn">PDFを開く<input id="file" type="file" accept="application/pdf"></label>
  </header>
  <div class="banner">
    <span id="modeLabel"></span>
    <span id="bannerText"></span>
    <a id="linkA" href="?mode=a">選管への確認（電話・赤入れツール）</a>
    <a id="linkB" href="?mode=b">立候補者情報の入力（確認用ツール）</a>
  </div>
  <div id="bulkBar">
    <strong>一括確認</strong>
    <button type="button" data-bulk="ふりがな">ふりがな</button>
    <button type="button" data-bulk="年齢">年齢</button>
    <button type="button" data-bulk="性別">性別</button>
    <button type="button" data-bulk="党派">党派</button>
  </div>
  <div class="main">
    <aside id="pinList" class="aonly">
      <h2>印</h2>
      <div id="pinListBody"></div>
    </aside>
    <div class="stage">
      <div class="pager" id="pager" hidden>
        <button type="button" id="prev">前のページ</button>
        <span id="pageLabel"></span>
        <button type="button" id="next">次のページ</button>
        <button type="button" id="zoomOut">－</button>
        <span id="zoomLabel"></span>
        <button type="button" id="zoomIn">＋</button>
      </div>
      <div id="empty"></div>
      <div class="page-wrap" id="pageWrap" hidden>
        <canvas id="pdf"></canvas>
        <div id="pinLayer"></div>
      </div>
    </div>
    <aside id="checksPanel" class="bonly sheet">
      <div class="sheetResize"></div>
      <div class="sheetHead">確認事項（ドラッグで移動）</div>
      <section id="checks">
        <div id="checkBody" class="block"></div>
      </section>
    </aside>
    <aside id="formPanel" class="bonly sheet">
      <div class="sheetResize"></div>
      <div class="sheetHead" id="formHead">入力欄（ドラッグで移動）</div>
      <section id="form">
        <div class="block">
          <div id="orders"></div>
          <button type="button" id="addOrder">＋別の届出順を追加</button>
          <button type="button" id="resetOrder">届出順1番のみに戻す</button>
        </div>
      </section>
      <section id="review" hidden>
        <h2>入力内容</h2>
        <div id="reviewBody" class="block"></div>
      </section>
    </aside>
    <div id="lock" hidden></div>
  </div>

  <div id="card" hidden>
    <header id="cardHandle"><span id="cardTitle">印</span></header>
    <div class="body">
      <label>電話で確認した正しい内容</label>
      <textarea id="answer"></textarea>
      <label class="checkline">
        <input id="pinUnsure" type="checkbox">
        確認したが内容に自信がない
      </label>
      <div class="row">
        <button type="button" id="deletePin">削除</button>
        <button type="button" id="closeCard">閉じる</button>
      </div>
    </div>
  </div>

  <div id="toast" hidden>
    <span id="toastText"></span>
    <button type="button" id="toastUndo">元に戻す</button>
  </div>
  <div id="modal" hidden>
    <div class="box">
      <p id="modalText"></p>
      <div class="actions">
        <button type="button" id="modalSecondary"></button>
        <button type="button" id="modalPrimary" class="primary"></button>
      </div>
    </div>
  </div>
  <div id="bulkPanel" hidden>
    <header>
      <span id="bulkTitle">一括確認</span>
      <button type="button" id="bulkClose">閉じる</button>
    </header>
    <div id="bulkBody"></div>
  </div>
  <datalist id="masters"></datalist>

  <script src="lib/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
    (function () {
      var params = new URLSearchParams(location.search);
      if (!params.has('mode')) {
        params.set('mode', 'a');
        location.replace(location.pathname + '?' + params.toString() + location.hash);
      }
    })();
    window.APP_MODE = new URLSearchParams(location.search).get('mode') === 'b' ? 'b' : 'a';
    window.HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
  </script>
  <script src="app.js?v=33"></script>
</body>
</html>
